name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q tests/reference
        if: hashFiles('tests/reference/sinergia.py') != ''
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crm .
        if: hashFiles('server/requirements.txt') != ''
